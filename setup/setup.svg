      <stop offset="0" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#1a1d2b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161d"/>
      <stop offset="1" stop-color="#08090c"/>
