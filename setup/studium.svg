  <line x1="1394" y1="618" x2="1398" y2="596" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
  <g fill="#34d399"><circle cx="1362" cy="630" r="1.6"/><circle cx="1370" cy="630" r="1.6"/><circle cx="1378" cy="630" r="1.6"/></g>

