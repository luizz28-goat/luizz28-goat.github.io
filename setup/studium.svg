<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000" width="1700" height="1000" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#1a1d2b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161d"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.55" stop-color="#d4418e"/>
      <stop offset="1" stop-color="#ff9a44"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a2c"/>
      <stop offset="1" stop-color="#2f241b"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Raum -->
  <rect width="1700" height="1000" fill="url(#wall)"/>
  <rect y="820" width="1700" height="180" fill="url(#floor)"/>
  <line x1="0" y1="820" x2="1700" y2="820" stroke="#2a2d3a" stroke-width="2"/>

  <!-- LED-Leiste hinter dem Schreibtisch -->
  <ellipse cx="560" cy="460" rx="520" ry="230" fill="url(#glowPurple)"/>
  <rect x="140" y="268" width="860" height="5" rx="2" fill="#a78bfa" filter="url(#blur)"/>
  <rect x="140" y="269" width="860" height="3" rx="1.5" fill="#c4b5fd"/>
  <ellipse cx="1250" cy="660" rx="220" ry="200" fill="url(#glowGreen)"/>

  
  <!-- Titel -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#f1f0ff">Das Beste unter 30.000 €</text>
  <text x="60" y="114" font-size="18" fill="#9ca3c4">Alles lokal · Gaming-PC · KI-Server · Uni-Laptop · Homelab</text>

  <!-- Verbindungen -->
