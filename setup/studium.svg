  </g>
  <g fill="#34d399"><circle cx="1141" cy="620" r="2"/><circle cx="1172" cy="620" r="2"/></g>
  <g fill="#4b5063"><circle cx="1203" cy="620" r="2"/><circle cx="1234" cy="620" r="2"/></g>
