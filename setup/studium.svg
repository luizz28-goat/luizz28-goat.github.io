    <text x="135" y="215" fill="#9ca3c4">9800X3D · RTX 5090 · 64 GB RAM · 360er-AIO</text>
    <text x="520" y="315" fill="#f1f0ff" font-weight="700" font-size="16" text-anchor="middle">4K-OLED · 240 Hz</text>
